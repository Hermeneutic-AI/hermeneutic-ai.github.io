# ================================================================
# Sveltia CMS configuration for Hermeneutic AI
# Docs: https://github.com/sveltia/sveltia-cms
# (uses the Decap/Netlify CMS config format)
# ================================================================

# ── Backend / authentication ─────────────────────────────────────
# Editing requires a GitHub account with WRITE access to this repo.
# Because GitHub Pages has no server, GitHub login is handled by a
# small Cloudflare Worker (the "sveltia-cms-auth" relay).
#
# Auth is handled by the shared sveltia-cms-auth Cloudflare Worker
# (its ALLOWED_DOMAINS must include hermeneutic-ai.github.io).
backend:
  name: github
  repo: Hermeneutic-AI/hermeneutic-ai.github.io
  branch: main
  base_url: https://sveltia-cms-auth.victor-shammas.workers.dev

# Where CMS-uploaded images are stored / referenced.
media_folder: "static/uploads"
public_folder: "/uploads"

site_url: https://hrmn.ai
display_url: https://hrmn.ai

# Don't write empty optional fields into the front matter on save —
# keeps plain tools free of unused monitors/shows/reports keys.
output:
  omit_empty_optional_fields: true

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

# ── Collections ──────────────────────────────────────────────────
collections:

  # ── Standalone pages ───────────────────────────────────────────
  - name: "pages"
    label: "Pages"
    delete: false
    editor:
      preview: false
    files:
      - name: "home"
        label: "Home"
        file: "content/_index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - name: "about"
        label: "About"
        file: "content/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - name: "contact"
        label: "Contact"
        file: "content/contact.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - name: "tools-intro"
        label: "Tools — section intro"
        file: "content/tools/_index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Intro text", name: "body", widget: "markdown" }

  # ── Authors / lab members ──────────────────────────────────────
  # Each author is one file at content/authors/<name>/_index.md. The bio
  # written here is the SINGLE source of truth: it shows on the About page
  # AND on the author's own profile page (/authors/<name>/), which also
  # auto-lists every research note credited to them.
  - name: "authors"
    label: "Authors / Lab members"
    label_singular: "Author"
    folder: "content/authors"
    path: "{{slug}}/_index"
    create: true
    delete: false
    identifier_field: "title"
    summary: "{{title}}"
    media_folder: "/static/uploads/authors"
    public_folder: "/uploads/authors"
    editor:
      preview: false
    fields:
      - { label: "Name", name: "title", widget: "string" }
      - { label: "Role / tagline", name: "role", widget: "string", required: false, hint: "Shown under the name, e.g. 'Sociologist · Associate Professor, University of Bergen'." }
      - { label: "Photo", name: "photo", widget: "image", required: false, hint: "A square headshot works best — shown as a round avatar on the About page and this author's profile page." }
      - { label: "Order (weight)", name: "weight", widget: "number", value_type: "int", default: 10, hint: "Lower numbers sort first on the About page." }
      - { label: "Bio", name: "body", widget: "markdown", hint: "Appears on both the About page and this author's profile page. Links are allowed." }

  # ── Research notes (add / edit freely) ─────────────────────────
  - name: "notes"
    label: "Research Notes"
    label_singular: "Research Note"
    folder: "content/notes"
    create: true
    delete: true
    slug: "{{slug}}"
    sort: "date:desc"
    summary: "{{title}}"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", required: false, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Short description", name: "description", widget: "string", required: false, hint: "One-line summary used in listings and link previews." }
      - label: "Authors"
        name: "authors"
        widget: "relation"
        collection: "authors"
        value_field: "title"
        search_fields: ["title"]
        display_fields: ["title"]
        multiple: true
        required: false
        hint: "Pick from the Authors collection. Bylines link to each author's profile page."
      - { label: "Body", name: "body", widget: "markdown" }

  # ── Tools ──────────────────────────────────────────────────────
  # A folder collection so NEW tools can be added from the admin panel
  # ("New Tool" button). One shared schema covers every tool; the
  # specialised sections (feed tabs, podcast shows, daily reports) are
  # optional and only saved when filled in. The hidden cms_type marker
  # keeps the section intro (_index.md, edited under Pages) out of this
  # list. omit_empty_optional_fields (set under `output:` above) keeps
  # unused optional fields from being written into the front matter.
  - name: "tools"
    label: "Tools"
    label_singular: "Tool"
    folder: "content/tools"
    create: true
    delete: true
    identifier_field: "title"
    summary: "{{title}}"
    sortable_fields: ["weight", "title", "status"]
    filter: { field: "cms_type", value: "tool" }
    media_folder: "/static/uploads/tools"
    public_folder: "/uploads/tools"
    editor:
      preview: false
    fields:
      - { label: "Marker", name: "cms_type", widget: "hidden", default: "tool" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Order (weight)", name: "weight", widget: "number", value_type: "int", default: 50, hint: "Lower numbers sort first in the tools list." }
      - { label: "Status", name: "status", widget: "string", hint: "e.g. Live, In Development, Planned." }
      - { label: "Short description", name: "description", widget: "string", required: false, hint: "One-line summary used in listings and link previews." }
      - label: "Layout"
        name: "layout"
        widget: "select"
        required: false
        options: ["embed", "audio"]
        hint: "Leave empty for a plain text page. 'embed' shows the feed tabs below; 'audio' shows the podcast shows."
      - label: "Feeds (tabs)"
        name: "monitors"
        widget: "list"
        label_singular: "Feed"
        required: false
        summary: "{{fields.label}}"
        hint: "Only used with the 'embed' layout. Each feed becomes a tab; 'Embed URL' should point at a chrome-free embed page."
        fields:
          - { label: "Tab label", name: "label", widget: "string" }
          - { label: "Embed URL", name: "src", widget: "string" }
      - label: "Shows"
        name: "shows"
        widget: "list"
        label_singular: "Show"
        required: false
        summary: "{{fields.name}}"
        hint: "Only used with the 'audio' layout."
        fields:
          - { label: "Show name", name: "name", widget: "string" }
          - { label: "Description", name: "description", widget: "string", required: false }
          - { label: "Podcast RSS feed URL", name: "feed", widget: "string", hint: "The five most recent episodes are pulled from this feed." }
          - { label: "Spotify show ID", name: "spotify_show", widget: "string", required: false, hint: "The ID from open.spotify.com/show/<id>." }
          - { label: "YouTube playlist ID", name: "youtube_playlist", widget: "string", required: false, hint: "The list= value from the playlist URL." }
      - label: "Daily reports"
        name: "reports"
        widget: "object"
        required: false
        hint: "Optional — GitHub repo the archived daily reports are read from (used with the 'embed' layout)."
        fields:
          - { label: "Repo owner", name: "owner", widget: "string" }
          - { label: "Repo name", name: "repo", widget: "string" }
          - { label: "Branch", name: "branch", widget: "string", default: "main" }
          - { label: "Path in repo", name: "path", widget: "string" }
          - { label: "Section title", name: "title", widget: "string" }
          - { label: "Section description", name: "description", widget: "string", required: false }
      - label: "URL aliases"
        name: "aliases"
        widget: "list"
        required: false
        field: { label: "Old URL path", name: "alias", widget: "string" }
        hint: "Old URL paths that should redirect to this tool, e.g. /tools/old-name/."
      - { label: "Intro text", name: "body", widget: "markdown" }
